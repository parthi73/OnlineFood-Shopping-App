<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Online Food Delivery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <a href="index.html" class="logo">🍽️ Online <span class="grad">Food</span></a>
  <nav><a href="index.html">Menu</a><a href="contact.html">Contact</a></nav>
</div></header>

<main class="wrap page" style="max-width:680px">
  <div class="form-card">
    <h2>Contact <span class="grad">us</span></h2>
    <p class="muted" style="text-align:left;padding:6px 0 0">Questions, feedback or a special order? Send us a message.</p>
    <form id="contactForm">
      <div class="fields">
        <div><label for="fn">First name</label><input id="fn" required></div>
        <div><label for="ln">Last name</label><input id="ln"></div>
        <div class="full"><label for="em">Email address</label><input id="em" type="email" required></div>
        <div class="full"><label for="msg">Message</label><textarea id="msg" required></textarea></div>
      </div>
      <button class="btn" type="submit">Submit</button>
      <button class="btn" type="reset" style="background:var(--bg);color:var(--text);box-shadow:none;border:1px solid var(--line);margin-left:8px">Clear</button>
    </form>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
